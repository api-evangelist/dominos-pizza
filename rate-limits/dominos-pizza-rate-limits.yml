specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Domino's Pizza
providerId: dominos-pizza
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Food Service
  - Restaurants
  - QSR
  - Rate Limiting
description: The undocumented endpoints behind Domino's apps are known to be rate-limited, but Domino's
  does not publish numeric per-second/per-minute limits. Community wrappers report that running rapid
  back-to-back requests can trigger short cool-down periods.
sources:
  - https://github.com/RIAEvangelist/node-dominos-pizza-api
notes: No official documentation; reconciled=false. Numeric limits are not published.
responseCodes: {}
limits:
  - name: Undocumented platform throttle
    scope: IP
    metric: varies
    limit: see community wrappers
    notes: Rapid back-to-back requests may be temporarily blocked.
policies:
  - name: Backoff Strategy
    description: Community wrappers recommend exponential backoff and pausing after a burst of test requests.
  - name: No Official SLA
    description: There is no commercial agreement; clients accept the risk of breaking changes and silent
      throttling.
maintainers:
