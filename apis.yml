description: >-
  Domino's Pizza is a major US quick-service restaurant corporation and Fortune
  1000 company. Domino's does NOT publish an official public developer API or a
  developer portal. Its digital ordering surface is delivered through consumer
  channels - the dominos.com website, the Domino's mobile apps, and the
  "AnyWare" ordering platform (text, voice, smart TV, Amazon Echo, Google Home,
  and more), including the "Dom" virtual voice ordering assistant. The
  undocumented HTTP endpoints behind these first-party apps have been
  reverse-engineered by the developer community into well-known UNOFFICIAL
  wrapper libraries (the npm "dominos" / node-dominos-pizza-api package and the
  Python "pizzapi" / "dominos" packages). These community libraries are not
  endorsed, supported, or warranted by Domino's. Domino's does expose APIs to
  select delivery-marketplace partners (e.g. Uber Eats, Just Eat) through direct
  partnership and a private Postman workspace, but these are not publicly
  available. No official API specification, pricing, or rate-limit policy is
  published.
