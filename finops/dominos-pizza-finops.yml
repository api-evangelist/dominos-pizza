description: FOCUS-aligned FinOps shape for Domino's. Domino's does not invoice for API consumption (the
  endpoints are undocumented and not commercial), so FinOps cost falls on the consumer's integration platform.
notes: No commercial billing relationship; reconciled=false. The actual billable transaction is the pizza
