principles:
  - name: Visibility
    description: Track endpoint calls and order placements in the consumer's logs; Domino's does not produce
      a usage invoice.
  - name: Allocation
    description: Allocate integration cost to the consuming product/feature (e.g. voice-ordering bot,
      kiosk).
  - name: Optimization
    description: Cache store and menu lookups; minimise polling against undocumented endpoints to reduce
      throttling risk.
  - name: Accountability
    description: Integration owner is accountable for monitoring breakage; there is no official Domino's
      developer relationship.
